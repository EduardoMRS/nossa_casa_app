services:
  media-init:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: >-
      sh -lc "touch /state/database.sqlite && php artisan migrate --force"
    env_file:
      - ${MEDIA_NODE_ENV_FILE:-.env.media-node}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /state/database.sqlite
      SKIP_NODE_INSTALL: "true"
    volumes:
      - .:/var/www
      - media-state:/state
    restart: "no"

  media-relay:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ${MEDIA_NODE_ENV_FILE:-.env.media-node}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /state/database.sqlite
      MEDIA_NODE_ROLE: relay
      MEDIA_RECORDINGS_PATH: /recordings
      SKIP_NODE_INSTALL: "true"
    volumes:
      - .:/var/www
      - media-recordings:/recordings
      - media-state:/state
    depends_on:
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  media-worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan queue:work --queue=media-relay --tries=12 --timeout=3600
    env_file:
      - ${MEDIA_NODE_ENV_FILE:-.env.media-node}
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /state/database.sqlite
      MEDIA_NODE_ROLE: relay
      MEDIA_RECORDINGS_PATH: /recordings
      SKIP_NODE_INSTALL: "true"
    volumes:
      - .:/var/www
      - media-recordings:/recordings
      - media-state:/state
    depends_on:
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mediamtx:
    build:
      context: .
      dockerfile: ./docker/mediamtx/Dockerfile
    env_file:
      - ${MEDIA_NODE_ENV_FILE:-.env.media-node}
    environment:
      MEDIA_RECORDING_WEBHOOK_URL: http://media-relay:8000/api/internal/media/relay-recording
    ports:
      - "${MEDIA_API_BIND_IP:-127.0.0.1}:9997:9997"
      - "1935:1935"
      - "8888:8888"
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - media-recordings:/recordings
    depends_on:
      - media-relay
    restart: unless-stopped

volumes:
  media-recordings:
  media-state:

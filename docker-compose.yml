services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    volumes:
      - .:/var/www
      - mediarecordings:/recordings
    ports:
      - "5173:5173"
    environment:
      MEDIA_DISK: ${DOCKER_MEDIA_DISK:-minio}
      MEDIA_ARCHIVE_DISK: ${DOCKER_MEDIA_ARCHIVE_DISK:-minio}
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-media-worker-1}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-local-media-worker-token}
      MEDIA_RECORDINGS_PATH: /recordings
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      MEDIAMTX_PUBLIC_HLS_URL: ${MEDIAMTX_PUBLIC_HLS_URL:-http://localhost:8888}
      MEDIAMTX_PUBLIC_RTMP_URL: ${MEDIAMTX_PUBLIC_RTMP_URL:-rtmp://localhost:1935}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nossa-casa}
      MINIO_URL: ${MINIO_URL:-http://localhost:9000/nossa-casa}
      MINIO_TEMPORARY_URL: ${MINIO_TEMPORARY_URL:-http://localhost:9000}
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  media-worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    command: php artisan queue:work --queue=media-recordings,default --tries=12 --timeout=3600
    volumes:
      - .:/var/www
      - mediarecordings:/recordings
    environment:
      MEDIA_DISK: ${DOCKER_MEDIA_DISK:-minio}
      MEDIA_ARCHIVE_DISK: ${DOCKER_MEDIA_ARCHIVE_DISK:-minio}
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-media-worker-1}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-local-media-worker-token}
      MEDIA_RECORDINGS_PATH: /recordings
      MEDIA_CORE_URL: http://webserver
      MEDIA_CORE_VERIFY_TLS: "false"
      MEDIA_CORE_REQUEST_TIMEOUT: 30
      DB_QUEUE_RETRY_AFTER: 3660
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nossa-casa}
      MINIO_URL: ${MINIO_URL:-http://localhost:9000/nossa-casa}
      MINIO_TEMPORARY_URL: ${MINIO_TEMPORARY_URL:-http://localhost:9000}
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_started
      mediamtx:
        condition: service_started
      webserver:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mediamtx:
    build:
      context: .
      dockerfile: ./docker/mediamtx/Dockerfile
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - mediarecordings:/recordings
    environment:
      MEDIA_WORKER_ID: ${MEDIA_WORKER_ID:-media-worker-1}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-local-media-worker-token}
      MEDIA_CORE_URL: http://webserver
      MEDIA_RECORDING_WEBHOOK_URL: http://webserver/api/internal/media/recording-segment-completed
    networks:
      - laravel_network

  webserver:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d/
    networks:
      - laravel_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    networks:
      - laravel_network
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000
      \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 1; done;
      mc mb --ignore-existing \"local/$${MINIO_BUCKET}\""
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-nossa-casa}
    networks:
      - laravel_network
    depends_on:
      - minio
    restart: "no"

volumes:
  dbdata:
  mediarecordings:
  miniodata:

networks:
  laravel_network:
    driver: bridge

name: Mobile build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build the signed Android test APK
        required: true
        type: boolean
        default: true
      build_ios:
        description: Build an iOS development IPA when signing credentials are configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVEPHP_APP_ID: br.org.nossacasa.app
  NATIVEPHP_APP_VERSION: 0.0.${{ github.run_number }}
  NATIVEPHP_APP_VERSION_CODE: ${{ github.run_number }}
  CI: 'true'

jobs:
  validate:
    name: Validate native app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, iconv, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('native/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare application
        run: |
          cp .env.ci.example .env
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          php artisan key:generate --force

      - name: Test and validate
        run: |
          php artisan test
          npm run build
          php artisan native:validate
          php artisan native:plugin:list

  android:
    name: Build signed APK
    needs: validate
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, iconv, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Prepare application
        run: |
          cp .env.ci.example .env
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          php artisan key:generate --force
          npm run build

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-upload.jks"

      - name: Package signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-upload.jks
        run: |
          export NATIVEPHP_GRADLE_PATH="$JAVA_HOME"
          export NATIVEPHP_ANDROID_SDK_LOCATION="$ANDROID_SDK_ROOT"
          php artisan native:package android \
            --build-type=release \
            --output="$GITHUB_WORKSPACE/dist/android" \
            --no-tty \
            --no-interaction

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nossa-casa-main-android-${{ github.run_number }}
          path: dist/android/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build development IPA
    needs: validate
    if: ${{ vars.MOBILE_BUILD_IOS_SIGNED == 'true' && github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    env:
      IOS_EXPORT_METHOD: development
      IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID }}
      NATIVEPHP_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, iconv, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Prepare application
        run: |
          cp .env.ci.example .env
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          php artisan key:generate --force
          npm run build

      - name: Restore Apple development signing credentials
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_SIGNING_CERTIFICATE_BASE64" || { echo "Missing IOS_SIGNING_CERTIFICATE_BASE64"; exit 1; }
          test -n "$IOS_SIGNING_CERTIFICATE_PASSWORD" || { echo "Missing IOS_SIGNING_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo "Missing IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }
          test -n "$IOS_TEAM_ID" || { echo "Missing IOS_TEAM_ID"; exit 1; }
          test -n "$IOS_DEVICE_UDID" || { echo "Missing IOS_DEVICE_UDID"; exit 1; }
          printf '%s' "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/development.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/development.mobileprovision"

      - name: Validate Personal Team provisioning profile
        run: |
          security cms -D \
            -i "$RUNNER_TEMP/development.mobileprovision" \
            -o "$RUNNER_TEMP/development-profile.plist"

          python3 - "$RUNNER_TEMP/development-profile.plist" <<'PY'
          import os
          import plistlib
          import sys
          from datetime import datetime, timezone

          with open(sys.argv[1], 'rb') as profile_file:
              profile = plistlib.load(profile_file)

          team_id = os.environ['IOS_TEAM_ID']
          device_udid = os.environ['IOS_DEVICE_UDID']
          bundle_id = os.environ['NATIVEPHP_APP_ID']
          expiration = profile.get('ExpirationDate')
          devices = profile.get('ProvisionedDevices', [])
          entitlements = profile.get('Entitlements', {})
          application_identifier = entitlements.get('application-identifier')
          profile_team_ids = profile.get('TeamIdentifier', [])

          if expiration is None or expiration.replace(tzinfo=timezone.utc) <= datetime.now(timezone.utc):
              raise SystemExit('Provisioning profile is expired')
          if team_id not in profile_team_ids:
              raise SystemExit('Provisioning profile does not belong to IOS_TEAM_ID')
          if device_udid not in devices:
              raise SystemExit('IOS_DEVICE_UDID is not included in the provisioning profile')
          if application_identifier != f'{team_id}.{bundle_id}':
              raise SystemExit('Provisioning profile does not match NATIVEPHP_APP_ID')
          if entitlements.get('get-task-allow') is not True:
              raise SystemExit('Provisioning profile is not a development profile')

          remaining = expiration.replace(tzinfo=timezone.utc) - datetime.now(timezone.utc)
          print(f'Profile valid until {expiration.isoformat()} ({remaining.days} full day(s) remaining)')
          PY

      - name: Package signed IPA
        run: |
          php artisan native:package ios \
            --export-method="$IOS_EXPORT_METHOD" \
            --certificate-path="$RUNNER_TEMP/development.p12" \
            --certificate-password="$IOS_SIGNING_CERTIFICATE_PASSWORD" \
            --provisioning-profile-path="$RUNNER_TEMP/development.mobileprovision" \
            --team-id="$IOS_TEAM_ID" \
            --rebuild \
            --output="$GITHUB_WORKSPACE/dist/ios" \
            --no-tty \
            --no-interaction

      - name: Verify signed IPA
        run: |
          ipa_path="$(find "$GITHUB_WORKSPACE/dist/ios" -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path" || { echo "Signed IPA was not generated"; exit 1; }
          unzip -q "$ipa_path" -d "$RUNNER_TEMP/verified-ipa"
          app_path="$(find "$RUNNER_TEMP/verified-ipa/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path" || { echo "IPA does not contain an app bundle"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nossa-casa-main-ios-${{ github.run_number }}
          path: dist/ios/**/*.ipa
          if-no-files-found: error
          retention-days: 7

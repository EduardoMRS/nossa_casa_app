name: Deploy NossaCasaApp to Arcane

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arcane-nossacasa-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ARCANE_UPDATE_WEBHOOK_URL: ${{ secrets.ARCANE_NOSSACASA_APP_UPDATE_WEBHOOK_URL }}
      ARCANE_DEPLOY_WEBHOOK_URL: ${{ secrets.ARCANE_NOSSACASA_APP_DEPLOY_WEBHOOK_URL }}

    steps:
      - name: Validate webhook secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [[ -z "${ARCANE_UPDATE_WEBHOOK_URL}" ]]; then
            echo "::error::Repository secret ARCANE_NOSSACASA_APP_UPDATE_WEBHOOK_URL is not available."
            missing=1
          fi

          if [[ -z "${ARCANE_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "::error::Repository secret ARCANE_NOSSACASA_APP_DEPLOY_WEBHOOK_URL is not available."
            missing=1
          fi

          exit "${missing}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production frontend image stage
        shell: bash
        run: |
          docker build \
            --file docker/Dockerfile \
            --target frontend-builder \
            --tag nossa-casa-frontend-build:${GITHUB_SHA} \
            .

      - name: Update NossaCasaApp in Arcane
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --max-time 120 \
              "${ARCANE_UPDATE_WEBHOOK_URL}"
          )"
          echo "${response}"
          jq -e '.success == true and .data.status == "accepted"' <<<"${response}" >/dev/null

      - name: Wait for Arcane project update
        shell: bash
        run: sleep 45

      - name: Deploy NossaCasaApp in Arcane
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --max-time 120 \
              "${ARCANE_DEPLOY_WEBHOOK_URL}"
          )"
          echo "${response}"
          jq -e '.success == true and .data.status == "accepted"' <<<"${response}" >/dev/null

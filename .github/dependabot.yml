version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'composer'
    directories:
      - '/'
      - '/native'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      composer-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/native'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/docker'
      - '/docker/mediamtx'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
